[package]
name = "swarm-scraper"
description = "Generic bulk scraper: one hub Actor coordinates many small crawlee-rs node Actors over a websocket on the hub's container URL."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
crawlee = { git = "https://github.com/apify/crawlee-rs", rev = "abf44b0651ef267f8272ed939eae52946155d257" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
